[build]
  publish = "."

[[redirects]]
  from = "/404"
  to   = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404

[build.environment]
  NODE_VERSION = "20"

# ── Security headers sent with every response ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Block MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer info sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable unused browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy
    # 'unsafe-inline' on style-src is required for AOS and inline <style> blocks;
    # 'unsafe-inline' on script-src is required for JSON-LD schema blocks.
    # Upgrade to nonce-based CSP when a build step is added.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://sakoya-website.netlify.app https://lh3.googleusercontent.com; connect-src 'self' https://www.google-analytics.com; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ── Cache static assets ────────────────────────────────────────────────────
[[headers]]
  for = "/תמונות/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
